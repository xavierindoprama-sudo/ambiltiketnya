<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offline - AmbilTiketnya</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" href="favicon.ico">
<style>
:root{color-scheme:light dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f4fb;font-family:Arial,sans-serif;text-align:center;padding:20px;color:#0f1222}
@media(prefers-color-scheme:dark){body{background:#090c16;color:#eef0fa}}
.w{max-width:340px}
.ic{width:80px;height:80px;border-radius:20px;background:linear-gradient(135deg,#5b4ef0,#8b5cf6);margin:0 auto 20px;display:grid;place-items:center}
.ic svg{stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{font-size:22px;margin:0 0 8px}
p{color:#667090;margin:0 0 24px;font-size:15px}
.btn{display:inline-block;padding:12px 24px;background:linear-gradient(135deg,#5b4ef0,#8b5cf6);color:#fff;border-radius:12px;text-decoration:none;font-weight:600;border:0;cursor:pointer;font-size:15px}
</style>
</head><body>
<div class="w">
  <div class="ic">
    <svg width="40" height="40" viewBox="0 0 24 24">
      <path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2z"/>
      <path d="M13 5v2M13 11v2M13 17v2"/>
    </svg>
  </div>
  <h1>Tidak ada koneksi</h1>
  <p>Periksa koneksi internet Anda dan coba lagi.</p>
  <button class="btn" onclick="location.reload()">Coba lagi</button>
</div>
</body></html>
