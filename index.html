  .then(r=>r.text()).then(x=>{clearTimeout(tm);const j=JSON.parse(x);if(j&&j.__error)throw new Error(j.__error);return j},e=>{clearTimeout(tm);throw e})}

/* ===== AUDIO SFX & CONFETTI (Self-Contained Singleton Web Audio) ===== */
let _actx = null;
function actx() {
  try {
    if (!_actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) _actx = new AC();
    }
    if (_actx && _actx.state === 'suspended') {
      _actx.resume().catch(() => {});
    }
  } catch(e) {}
  return _actx;
}

if (typeof window !== 'undefined') {
  const unlockAudio = () => {
    try {
      const c = actx();
      if (c && c.state === 'suspended') c.resume().catch(() => {});
    } catch(e) {}
  };
  ['click', 'keydown', 'touchstart'].forEach(ev => {
    window.addEventListener(ev, unlockAudio, { passive: true });
  });
}

function playSfx(type) {
  try {
    const c = actx();
    if (!c) return;
    if (c.state === 'suspended') {
      c.resume().catch(() => {});
    }
    const t = c.currentTime;
    if (type === 'tick') {
      const osc = c.createOscillator();
      const gain = c.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(580, t);
      osc.frequency.exponentialRampToValueAtTime(180, t + 0.04);
      gain.gain.setValueAtTime(0.12, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
      osc.connect(gain);
      gain.connect(c.destination);
      osc.start(t);
      osc.stop(t + 0.045);
    } else if (type === 'win') {
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = 'sine';
        const startT = t + i * 0.11;
        const dur = (i === 3) ? 1.0 : 0.45;
        osc.frequency.setValueAtTime(freq, startT);
        gain.gain.setValueAtTime(0.2, startT);
        gain.gain.exponentialRampToValueAtTime(0.001, startT + dur);
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start(startT);
        osc.stop(startT + dur + 0.05);
      });
    }
  } catch(e) {}
}

function triggerConfetti(canvasId) {
  const c = document.getElementById(canvasId || 'dp_confetti');
  if (!c) return;
  const ctx = c.getContext('2d');
  c.width = c.parentElement.clientWidth || window.innerWidth;
  c.height = c.parentElement.clientHeight || window.innerHeight;
  const colors = ['#d4af37', '#f59e0b', '#3b82f6', '#10b981', '#ec4899', '#8b5cf6'];
  const particles = Array.from({ length: 90 }, () => ({
    x: c.width / 2 + (Math.random() - 0.5) * 80,
    y: c.height / 2 - 20,
    vx: (Math.random() - 0.5) * 16,
    vy: -(Math.random() * 12 + 6),
    size: Math.random() * 8 + 5,
    color: colors[Math.floor(Math.random() * colors.length)],
    rot: Math.random() * 360,
    vrot: (Math.random() - 0.5) * 12,
    alpha: 1
  }));
  let frames = 0;
  function anim() {
    ctx.clearRect(0, 0, c.width, c.height);
    let alive = false;
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.35;
      p.vx *= 0.98;
      p.rot += p.vrot;
      if (frames > 40) p.alpha -= 0.015;
      if (p.alpha > 0) {
        alive = true;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rot * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
        ctx.restore();
      }
    });
    frames++;
    if (alive && frames < 140) requestAnimationFrame(anim);
    else ctx.clearRect(0, 0, c.width, c.height);
  }
  requestAnimationFrame(anim);
}

function openStageWindow(url, name) {
  let left = 0, top = 0, width = 1280, height = 720;
  try {
    if (window.screen && window.screen.availWidth) {
      left = window.screen.availWidth;
    }
  } catch(e) {}
  const w = window.open(url, name || 'atk_stage_win', `left=${left},top=${top},width=${width},height=${height},menubar=no,toolbar=no,location=no,status=no,resizable=yes`);
  if (w) {
    try { w.focus(); } catch(e) {}
  }
  return w;
}

let _dpBc = null;
function getDpBc() {
  if (!_dpBc && typeof BroadcastChannel !== 'undefined') {
    try { _dpBc = new BroadcastChannel('atk_dp_channel'); } catch(e) {}
  }
  return _dpBc;
}
function dpBroadcast(data) {
  const bc = getDpBc();
  if (bc) {
    try { bc.postMessage(data); } catch(e) {}
  }
  try {
    localStorage.setItem('atk_dp_sync', JSON.stringify({ t: Date.now(), data }));
  } catch(e) {}
}

let _dpOpListening = false;
function setupDpOperatorListener() {
  if (_dpOpListening) return;
  _dpOpListening = true;
  const bc = getDpBc();
  const handleOpMsg = (data) => {
    if (!data) return;
    if (data.action === 'stage_ready' || data.action === 'pong') {
      updateDpOperatorStatus(true);
      dpBroadcast({
        action: 'sync',
        prize: S_dp.prize,
        candCount: S_dp.candidates ? S_dp.candidates.length : 0,
        winCount: S_dp.winners ? S_dp.winners.length : 0
      });
    }
  };
  if (bc) {
    bc.onmessage = (e) => handleOpMsg(e.data);
  }
  window.addEventListener('storage', (e) => {
    if (e.key === 'atk_dp_sync' && e.newValue) {
      try { const obj = JSON.parse(e.newValue); if (obj && obj.data) handleOpMsg(obj.data); } catch(err) {}
    }
  });
}

function runStageSpinAnimation(data) {
  const winner = data.winner;
  const cands = data.candidates || [];
  if (!winner || !cands.length) return;

  const tag = $('#st_cand_tag'), nameEl = $('#st_cand_name'), orgEl = $('#st_cand_org'), codeEl = $('#st_cand_code');
  if (tag) tag.textContent = 'SEDANG DIACAK...';

  let count = 0;
  const totalSteps = 38;
  let delay = 50;

  function rollStep() {
    const rand = cands[Math.floor(Math.random() * cands.length)];
    if (nameEl) {
      nameEl.textContent = rand.name || 'Peserta';
      nameEl.style.color = '#ffffff';
    }
    if (orgEl) orgEl.textContent = rand.org || rand.church || 'Hadir';
    if (codeEl) codeEl.textContent = rand.code || rand.ticket_code || 'TKT-????';
    playSfx('tick');

    count++;
    if (count < totalSteps) {
      if (count > totalSteps - 12) delay += 28;
      setTimeout(rollStep, delay);
    } else {
      if (tag) tag.textContent = '🎉 SELAMAT KEPADA PEMENANG! 🎉';
      if (nameEl) {
        nameEl.textContent = winner.name || 'Peserta';
        nameEl.style.color = '#f3dc8a';
      }
      if (orgEl) orgEl.textContent = winner.church || winner.guest_org || winner.org || '-';
      if (codeEl) codeEl.textContent = winner.ticket_code || winner.code;

      playSfx('win');
      triggerConfetti('st_ext_confetti');
    }
  }
  rollStep();
}

  dpBroadcast({ action: 'pong' });
}

function md2html(md) {
  if (!md) return '';
  let h = esc(md);
  h = h.replace(/^### (.*$)/gim, '<h4 style="margin:16px 0 6px;color:#818cf8;font-size:15px">$1</h4>');
  h = h.replace(/^## (.*$)/gim, '<h3 style="margin:20px 0 8px;color:#a5b4fc;font-size:17px;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:6px">$1</h3>');
  h = h.replace(/^# (.*$)/gim, '<h2 style="margin:22px 0 10px;font-size:19px">$1</h2>');
  h = h.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
  h = h.replace(/\*(.*?)\*/g, '<i>$1</i>');
  h = h.replace(/^> (.*$)/gim, '<blockquote style="border-left:3px solid #8b5cf6;margin:10px 0;padding:6px 12px;background:rgba(139,92,246,.08);border-radius:0 8px 8px 0">$1</blockquote>');
  h = h.replace(/^\s*[-*]\s+(.*$)/gim, '<div style="margin:4px 0 4px 12px;display:flex;align-items:flex-start;gap:6px"><span>•</span><div>$1</div></div>');
  h = h.replace(/^\s*(\d+)\.\s+(.*$)/gim, '<div style="margin:4px 0 4px 12px;display:flex;align-items:flex-start;gap:6px"><b>$1.</b><div>$2</div></div>');
  h = h.replace(/\n\n+/g, '<br><br>');
  h = h.replace(/\n/g, '<br>');
  return h;
}

function getDeviceId(){

/* ===== OFFLINE ENGINE ===== */
function getOfflineStorage(){try{return JSON.parse(localStorage.getItem('atk_off_data')||'{}')}catch(e){return{}}}
function setOfflineStorage(d){try{localStorage.setItem('atk_off_data',JSON.stringify(d))}catch(e){}}
function getOfflineQueue(){try{return JSON.parse(localStorage.getItem('atk_off_q')||'[]')}catch(e){return[]}}
function setOfflineQueue(q){try{localStorage.setItem('atk_off_q',JSON.stringify(q))}catch(e){}}

async function cacheOfflineEvent(eventId,silent){if(!eventId)return toast('Pilih acara terlebih dahulu',1);
 try{const res=await api('offlineManifest',{eventId:eventId},silent?'':t('loading'));const store=getOfflineStorage();store[eventId]=res;setOfflineStorage(store);
  if(!silent)toast('✅ Berhasil menyimpan '+res.count+' tiket offline untuk '+res.eventName+'!',0);paintOfflineStatus();
 }catch(e){if(!silent)fail(e)}}

function checkOfflineTicket(code){const c=String(code||'').trim().toUpperCase(),store=getOfflineStorage();
 for(const evId in store){const man=store[evId];if(man&&man.tickets){const t=man.tickets.find(x=>String(x.code||'').trim().toUpperCase()===c);if(t)return{ticket:t,eventId:evId,eventName:man.eventName}}}
 return null}

function offlineValidate(code){const match=checkOfflineTicket(code);if(!match)return{result:'NOT_FOUND',code:code,isOffline:true,message:'Tiket tidak ada di database offline HP ini.'};
 const t=match.ticket,base={code:t.code,kind:t.kind,name:t.name,church:t.church,age:t.age,event:t.event_name||match.eventName,qty:t.qty,isOffline:true};
 if(t.status==='cancelled')return Object.assign(base,{result:'CANCELLED'});
 if(t.status==='pending_payment')return Object.assign(base,{result:'UNPAID'});
 if(t.checked>=t.qty)return Object.assign(base,{result:'USED',checked:t.checked});
 t.checked=t.qty;const store=getOfflineStorage();setOfflineStorage(store);
 const q=getOfflineQueue();q.push({code:t.code,at:new Date().toISOString()});setOfflineQueue(q);paintOfflineStatus();
 return Object.assign(base,{result:'VALID',entered:t.qty,checked:t.qty,at:new Date().toISOString()})}

async function syncOfflineQueue(){const q=getOfflineQueue();if(!q.length)return toast('Tidak ada antrean tiket offline.',0);
 try{const res=await api('syncOfflineCheckins',{checkins:q},t('loading'));setOfflineQueue([]);toast('✅ '+(res.synced||q.length)+' tiket offline berhasil disinkronkan ke server!',0);paintOfflineStatus();
  if(S.view==='orders')loadOrders();else if(S.view==='dash')dash($('#ac'));
 }catch(e){fail(e)}}

function paintOfflineStatus(){const badge=$('#off_badge_area'),info=$('#off_info'),btnSync=$('#btn_syncoff'),qCnt=$('#off_q_cnt'),sel=$('#off_ev_sel');
 const store=getOfflineStorage(),evIds=Object.keys(store),q=getOfflineQueue();
 if(sel&&S.aev){const cur=sel.value;sel.innerHTML=S.aev.map(e=>`<option value="${e.id}" ${e.id===cur?'selected':''}>${esc(e.name)}</option>`).join('')}
 if(btnSync){btnSync.style.display=q.length?'inline-flex':'none';if(qCnt)qCnt.textContent=q.length}

function compressImageToWebp(file, maxW = 1200, maxH = 675, quality = 0.82) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith('image/')) return reject(new Error('File bukan gambar'));
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Gagal membaca file gambar'));
    reader.onload = e => {
      const img = new Image();
      img.onerror = () => reject(new Error('Format gambar tidak didukung atau file korup'));
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxW || h > maxH) {
          const ratio = Math.min(maxW / w, maxH / h);
          w = Math.max(1, Math.round(w * ratio));
          h = Math.max(1, Math.round(h * ratio));
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        let dataUrl = canvas.toDataURL('image/webp', quality);
        if (!dataUrl.startsWith('data:image/webp')) {
          dataUrl = canvas.toDataURL('image/jpeg', quality);
        }
        const originalSizeKb = Math.max(1, Math.round(file.size / 1024));
        const approxNewSizeKb = Math.max(1, Math.round((dataUrl.length * 3 / 4) / 1024));
        resolve({
          dataUrl,
          width: w,
          height: h,
          originalSizeKb,
          compressedSizeKb: approxNewSizeKb
        });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function initBannerUploader() {
  const dropzone = $('#ef_dropzone');
  const fileInput = $('#ef_file_input');
  const bannerUrlInp = $('#ef_banner_url');
  const previewWrap = $('#ef_preview_wrap');
  const previewImg = $('#ef_preview_img');
  const dropPrompt = $('#ef_drop_prompt');
  const uploadSpin = $('#ef_upload_spin');
  const imgInfo = $('#ef_img_info');
  const sizeBadge = $('#ef_size_badge');
  const toggleUrlBtn = $('#ef_toggle_url_btn');
  const manualBox = $('#ef_manual_url_box');
  const manualInp = $('#ef_manual_url_inp');
  const btnRepick = $('#ef_btn_repick');
  const btnRemove = $('#ef_btn_remove');

  if (!dropzone || !fileInput || !bannerUrlInp) return;

  function showProcessing(busy) {
    if (uploadSpin) uploadSpin.style.display = busy ? 'block' : 'none';
    if (dropPrompt) dropPrompt.style.display = busy ? 'none' : (bannerUrlInp.value ? 'none' : 'block');
    if (previewWrap) previewWrap.style.display = busy ? 'none' : (bannerUrlInp.value ? 'block' : 'none');
  }

  async function handleFile(file) {
    if (!file) return;
    if (!file.type.startsWith('image/')) {
      toast('File yang dipilih bukan gambar (JPG, PNG, WEBP).', 1);
      return;
    }
    showProcessing(true);
    try {
      const res = await compressImageToWebp(file, 1200, 675, 0.82);
      bannerUrlInp.value = res.dataUrl;
      previewImg.src = res.dataUrl;
      const pct = Math.max(0, Math.round((1 - res.compressedSizeKb / res.originalSizeKb) * 100));
      if (imgInfo) imgInfo.textContent = `✓ ${res.width}x${res.height} px · ${res.compressedSizeKb} KB`;
      if (sizeBadge) sizeBadge.textContent = `⚡ Hemat ${pct}% (${res.originalSizeKb} KB ➔ ${res.compressedSizeKb} KB)`;
      showProcessing(false);
      toast('Poster berhasil dioptimalkan dan siap disimpan!', 0);
    } catch (err) {
      showProcessing(false);
      toast('Gagal memproses gambar: ' + (err.message || err), 1);
    }
  }

  dropzone.addEventListener('click', e => {
    if (e.target.closest('#ef_btn_repick') || e.target.closest('#ef_btn_remove') || e.target.closest('#ef_manual_url_box') || e.target.closest('#ef_toggle_url_btn')) return;
    if (!bannerUrlInp.value) fileInput.click();
  });

  if (btnRepick) btnRepick.addEventListener('click', e => { e.stopPropagation(); fileInput.click(); });
  if (btnRemove) btnRemove.addEventListener('click', e => {
    e.stopPropagation();
    bannerUrlInp.value = '';
    previewImg.src = '';
    if (sizeBadge) sizeBadge.textContent = '';
    if (manualInp) manualInp.value = '';
    if (previewWrap) previewWrap.style.display = 'none';
    if (dropPrompt) dropPrompt.style.display = 'block';
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files && fileInput.files[0]) {
      handleFile(fileInput.files[0]);
      fileInput.value = '';
    }
  });

  ['dragenter', 'dragover'].forEach(evName => {
    dropzone.addEventListener(evName, e => {
      e.preventDefault();
      e.stopPropagation();
      dropzone.style.borderColor = 'var(--ac, #5b4ef0)';
      dropzone.style.background = 'rgba(91,78,240,0.06)';
    });
  });

  ['dragleave', 'drop'].forEach(evName => {
    dropzone.addEventListener(evName, e => {
      e.preventDefault();
      e.stopPropagation();
      dropzone.style.borderColor = 'var(--bd)';
      dropzone.style.background = 'var(--in, rgba(0,0,0,0.02))';
    });
  });

  dropzone.addEventListener('drop', e => {
    const dt = e.dataTransfer;
    if (dt && dt.files && dt.files[0]) {
      handleFile(dt.files[0]);
    }
  });

  if (toggleUrlBtn && manualBox && manualInp) {
    toggleUrlBtn.addEventListener('click', () => {
      const isHidden = manualBox.style.display === 'none';
      manualBox.style.display = isHidden ? 'block' : 'none';
      if (isHidden) manualInp.focus();
    });

    manualInp.addEventListener('input', () => {
      const val = manualInp.value.trim();
      bannerUrlInp.value = val;
      if (val) {
        previewImg.src = val;
        if (previewWrap) previewWrap.style.display = 'block';
        if (dropPrompt) dropPrompt.style.display = 'none';
        if (imgInfo) imgInfo.textContent = 'Link eksternal';
        if (sizeBadge) sizeBadge.textContent = '';
      } else {
        previewImg.src = '';
        if (previewWrap) previewWrap.style.display = 'none';
        if (dropPrompt) dropPrompt.style.display = 'block';
      }
    });
  }
}

 if(!vr.width||!vr.height||!frc||!frc.width||!frc.height){const w=v.videoWidth*0.6,h=v.videoHeight*0.6;return {x:(v.videoWidth-w)/2,y:(v.videoHeight-h)/2,w:w,h:h}}

 const ox=((v.videoWidth*s)-vr.width)/2,oy=((v.videoHeight*s)-vr.height)/2;
 const x=Math.max(0,((frc.left-vr.left)+ox)/s),y=Math.max(0,((frc.top-vr.top)+oy)/s);
 const w=Math.min(v.videoWidth-x,frc.width/s),h=Math.min(v.videoHeight-y,frc.height/s);

async function startCamera(){const v=$('#sc_video');if(!v)return;try{

 const caps=_track&&_track.getCapabilities?_track.getCapabilities():{};const tb=$('#sc_torch_btn');if(tb)tb.style.display=caps.torch?'grid':'none';
 const bd=('BarcodeDetector' in window)?new BarcodeDetector({formats:['qr_code']}):null;const canvas=$('#sc_canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});

  if(!_scanning)return;
  if(!_cooldown&&v.readyState>=2){
   try{
    let code='';
    const roi=getFrameRoi(v,$('#sc_frame'));
    if(bd){
     const det=await bd.detect(v);
     if(det&&det.length){
      for(const it of det){
       if(!it.rawValue)continue;
       if(roi){
        let cx=0,cy=0;
        if(it.boundingBox&&(it.boundingBox.width||it.boundingBox.height)){
         const bx=(it.boundingBox.x!==undefined?it.boundingBox.x:it.boundingBox.left)||0;
         const by=(it.boundingBox.y!==undefined?it.boundingBox.y:it.boundingBox.top)||0;
         cx=bx+(it.boundingBox.width||0)/2;
         cy=by+(it.boundingBox.height||0)/2;
        }else if(it.cornerPoints&&it.cornerPoints.length){
         cx=it.cornerPoints.reduce((a,b)=>a+(b.x||0),0)/it.cornerPoints.length;
         cy=it.cornerPoints.reduce((a,b)=>a+(b.y||0),0)/it.cornerPoints.length;
        }
        if(cx||cy){
         const px=roi.w*0.12,py=roi.h*0.12;
         if(cx<roi.x-px||cx>roi.x+roi.w+px||cy<roi.y-py||cy>roi.y+roi.h+py)continue;
        }
       }
       code=it.rawValue;
       break;
      }
     }
    }else if(typeof jsQR!=='undefined'&&v.videoWidth){
     if(roi&&roi.w>30&&roi.h>30){
      const sz=Math.min(480,Math.max(260,Math.round(roi.w)));
      canvas.width=sz;canvas.height=sz;
      ctx.drawImage(v,roi.x,roi.y,roi.w,roi.h,0,0,sz,sz);

      if(res&&res.data)code=res.data;
     }else{
      canvas.width=v.videoWidth;canvas.height=v.videoHeight;
      ctx.drawImage(v,0,0);
      const d=ctx.getImageData(0,0,canvas.width,canvas.height),res=jsQR(d.data,d.width,d.height);

async function doValidate(code, enteredQty, isConfirm){try{let r;
 const curCp=($('#scan_view_cp_sel')?$('#scan_view_cp_sel').value:($('#sc_cp_sel')?$('#sc_cp_sel').value:'main_gate'));
 if(!navigator.onLine){r=offlineValidate(code)}
 else{
  try{r=await api('validate',{code:code,checkpoint:curCp,entered_qty:enteredQty,confirm:isConfirm},t('loading'))}
  catch(apiErr){const off=offlineValidate(code);if(off.result!=='NOT_FOUND')r=off;else throw apiErr}
 }
 if(r.result==='VALID'){
  _sessionCount+=(r.claimed_qty||r.entered||r.qty||1);
  const cnt=$('#sc_cnt'),dc=$('#dash_sc_cnt');if(cnt)cnt.textContent=_sessionCount;if(dc)dc.textContent=_sessionCount;
  if(S.activeEventId)loadCheckpoints(S.activeEventId);
 }
 snd(r.result==='CONFIRM_PARTIAL'?'USED':r.result);vib(r.result==='CONFIRM_PARTIAL'?'USED':r.result);
 const fr=$('#sc_frame'),resArea=$('#sc_res');
 if(fr)fr.className='sc-frame '+(r.result==='VALID'?'valid':(r.result==='USED'||r.result==='CONFIRM_PARTIAL'||r.result==='UNPAID'||r.result==='NOT_CHECKED_IN'||r.result==='ALREADY_CLAIMED')?'used':'error');
 if(resArea)resArea.innerHTML=scCardHtml(r);
 S.res=r;S.hist.unshift({code:r.code,name:r.name,result:r.result,qty:r.qty,entered:r.entered,time:new Date().toLocaleTimeString(loc())});S.hist=S.hist.slice(0,30);paintScan();return r
}catch(e){snd('ERROR');vib('ERROR');fail(e);return {result:'ERROR',message:errMsg(e)}}}

async function A_cpSaveAdminSubmit(el){

async function startSelfScanCamera(ticketCode){
 const vid=$('#self_scan_vid'),cvs=$('#self_scan_cvs');
 if(!vid||!cvs)return;
 _selfScanning=true;

 try{
  const stream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}
  });
  _selfScannerStream=stream;
  vid.srcObject=stream;
  await vid.play();

  const ctx=cvs.getContext('2d',{willReadFrequently:true});

  function tick(){
   if(!_selfScanning)return;
   if(vid.readyState===vid.HAVE_ENOUGH_DATA&&typeof jsQR!=='undefined'){
    cvs.width=vid.videoWidth;
    cvs.height=vid.videoHeight;
    ctx.drawImage(vid,0,0,cvs.width,cvs.height);
    const imgData=ctx.getImageData(0,0,cvs.width,cvs.height);
    const code=jsQR(imgData.data,imgData.width,imgData.height,{inversionAttempts:'dontInvert'});
    if(code&&code.data){
     handleScannedSessionUrl(code.data,ticketCode);
     return;
    }
   }
   requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
 }catch(err){
  toast('Tidak dapat mengakses kamera: '+(err.message||err),1);
  closeSelfScanModal();
 }
}

function closeSelfScanModal(){
 _selfScanning=false;
 if(_selfScannerStream){
  _selfScannerStream.getTracks().forEach(t=>t.stop());
  _selfScannerStream=null;
 }
 cm();
}

const toB64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(f)});

function qrDataUrl(code, size = 260) {
  if (typeof qrcode === 'undefined') return '';
  const q = qrcode(0, 'M');
  q.addData(code);
  q.make();
  const n = q.getModuleCount();
  const c = document.createElement('canvas');
  c.width = size;
  c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = '#000000';
  const m = size / n;
  for (let r = 0; r < n; r++) {
    for (let col = 0; col < n; col++) {
      if (q.isDark(r, col)) {
        ctx.fillRect(col * m, r * m, m, m);
      }
    }
  }
  return c.toDataURL('image/png');
}

  if (!window.jspdf || !window.jspdf.jsPDF) throw new Error('Pustaka PDF belum dimuat');
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: 'p', unit: 'pt', format: 'a4' });
  const pw = 595.28, ph = 841.89, mx = 36, cw = pw - (mx * 2);
  const inv = o.kind === 'invitation', wlk = o.kind === 'walk_in';

  // 1. Header Banner
  if (inv) {
    pdf.setFillColor(11, 16, 38);
    pdf.rect(0, 0, pw, 75, 'F');
    pdf.setFillColor(212, 175, 55);
    pdf.rect(0, 75, pw, 4, 'F');
    pdf.setTextColor(212, 175, 55);
    pdf.setFont('helvetica', 'bold');
    pdf.setFontSize(12);
    pdf.text('U N D A N G A N', mx, 28);
    pdf.setTextColor(255, 255, 255);
    pdf.setFontSize(18);
    pdf.text(pdf.splitTextToSize(o.name || o.event_name || 'E-Tiket Undangan', cw), mx, 52);
  } else if (wlk) {
    pdf.setFillColor(6, 78, 59);
    pdf.rect(0, 0, pw, 75, 'F');
    pdf.setFillColor(16, 185, 129);
    pdf.rect(0, 75, pw, 4, 'F');
    pdf.setTextColor(52, 211, 153);
    pdf.setFont('helvetica', 'bold');
    pdf.setFontSize(10);
    pdf.text('E - T I K E T   W A L K - I N   (D I   T E M P A T)', mx, 28);
    pdf.setTextColor(255, 255, 255);
    pdf.setFontSize(18);
    pdf.text(pdf.splitTextToSize(o.name || o.event_name || 'E-Tiket Walk-In', cw), mx, 52);
  } else {
    pdf.setFillColor(15, 18, 34);
    pdf.rect(0, 0, pw, 75, 'F');
    pdf.setFillColor(91, 78, 240);
    pdf.rect(0, 75, pw, 4, 'F');
    pdf.setTextColor(154, 140, 255);
    pdf.setFont('helvetica', 'bold');
    pdf.setFontSize(10);
    pdf.text('E - T I K E T   R E S M I', mx, 28);
    pdf.setTextColor(255, 255, 255);
    pdf.setFontSize(18);
    pdf.text(pdf.splitTextToSize(o.name || o.event_name || 'E-Tiket Resmi', cw), mx, 52);
  }

  let curY = 96;

  // 2. Guest Info (Undangan / Walk-In)
  if (inv) {
    pdf.setFillColor(255, 253, 247);
    pdf.setDrawColor(212, 175, 55);
    pdf.roundedRect(mx, curY, cw, 50, 4, 4, 'FD');
    pdf.setTextColor(184, 146, 31);
    pdf.setFont('helvetica', 'bold');
    pdf.setFontSize(8.5);
    pdf.text('KEPADA YTH.', mx + 14, curY + 16);
    pdf.setTextColor(11, 16, 38);
    pdf.setFontSize(14);
    pdf.text(String(o.guest_name || '-'), mx + 14, curY + 32);
    pdf.setTextColor(100, 100, 100);
    pdf.setFont('helvetica', 'normal');
    pdf.setFontSize(9.5);
    const gMeta = (o.guest_org || '') + (o.guest_phone ? ' · +' + o.guest_phone : '') + (o.guest_age ? ' · ' + o.guest_age + ' thn' : '');
    pdf.text(gMeta, mx + 14, curY + 44);
    curY += 60;
  } else if (wlk) {
    pdf.setFillColor(240, 253, 244);
    pdf.setDrawColor(16, 185, 129);
    pdf.roundedRect(mx, curY, cw, 50, 4, 4, 'FD');
    pdf.setTextColor(5, 150, 105);
    pdf.setFont('helvetica', 'bold');
    pdf.setFontSize(8.5);
    pdf.text('PESERTA WALK-IN', mx + 14, curY + 16);
    pdf.setTextColor(6, 78, 59);
    pdf.setFontSize(14);
    pdf.text(String(o.guest_name || o.name || '-'), mx + 14, curY + 32);
    pdf.setTextColor(100, 100, 100);
    pdf.setFont('helvetica', 'normal');
    pdf.setFontSize(9.5);
    const wMeta = (o.guest_org || o.church || '-') + (o.guest_phone ? ' · +' + o.guest_phone : '');
    pdf.text(wMeta, mx + 14, curY + 44);
    curY += 60;
  }

  // 3. QR Code & Event Details
  const qrSize = 125;
  const qrImg = qrDataUrl(o.ticket_code, 260);
  if (qrImg) {
    if (inv) {
      pdf.setDrawColor(212, 175, 55);
      pdf.rect(mx, curY, qrSize, qrSize);
    }
    pdf.addImage(qrImg, 'PNG', mx + 2, curY + 2, qrSize - 4, qrSize - 4);
    pdf.setFont('courier', 'bold');
    pdf.setFontSize(11);
    pdf.setTextColor(15, 18, 34);
    pdf.text(o.ticket_code, mx + (qrSize / 2), curY + qrSize + 13, { align: 'center' });
    pdf.setFont('helvetica', 'normal');
    pdf.setFontSize(7.5);
    pdf.setTextColor(120, 128, 145);
    pdf.text('Pindai di gerbang masuk', mx + (qrSize / 2), curY + qrSize + 23, { align: 'center' });
  }

  const colX = mx + qrSize + 20;
  const colW = cw - qrSize - 20;
  let detY = curY + 6;

  const fld = (label, val) => {
    pdf.setFont('helvetica', 'bold');
    pdf.setFontSize(7.5);
    pdf.setTextColor(120, 128, 145);
    pdf.text(label.toUpperCase(), colX, detY);
    detY += 11;
    pdf.setFont('helvetica', 'bold');
    pdf.setFontSize(11);
    pdf.setTextColor(15, 18, 34);
    const sVal = pdf.splitTextToSize(String(val || '-'), colW);
    pdf.text(sVal, colX, detY);
    detY += (sVal.length * 12.5) + 5;
  };

  fld('Hari & Tanggal', fd(o.event_date, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }));
  fld('Waktu', tm(o));
  fld('Lokasi', o.location);
  if (!inv && !wlk) fld('Nama Pemesan', (S.user && S.user.name) || o.uname || '-');
  fld('Jumlah Tiket', (o.qty || 1) + ' orang (' + (o.qty || 1) + ' tiket)');
  fld(inv ? 'Nomor Undangan' : wlk ? 'Nomor Walk-In' : 'Nomor Pesanan', o.order_code || o.id);

  curY = Math.max(curY + qrSize + 30, detY + 4);

  // 4. Catatan / Pengumuman
  if (inv && o.qty > 1) {
    pdf.setFillColor(255, 251, 230);
    pdf.setDrawColor(255, 229, 143);
    pdf.roundedRect(mx, curY, cw, 26, 3, 3, 'FD');
    pdf.setTextColor(135, 77, 0);
    pdf.setFont('helvetica', 'bold');
    pdf.setFontSize(8);
    const nStr = 'ⓘ Catatan: Satu kode QR ini berlaku untuk ' + o.qty + ' orang. Mohon hadir dan masuk bersamaan di gerbang masuk karena tiket hanya dapat dipindai 1 kali.';
    pdf.text(pdf.splitTextToSize(nStr, cw - 16), mx + 8, curY + 12);
    curY += 34;
  } else if (o.announcement) {
    pdf.setFillColor(241, 240, 255);
    pdf.setDrawColor(218, 215, 254);
    pdf.roundedRect(mx, curY, cw, 26, 3, 3, 'FD');
    pdf.setTextColor(60, 50, 150);
    pdf.setFont('helvetica', 'normal');
    pdf.setFontSize(8);
    pdf.text(pdf.splitTextToSize('Pengumuman: ' + o.announcement, cw - 16), mx + 8, curY + 12);
    curY += 34;
  }

  // 5. Divider
  pdf.setDrawColor(220, 224, 235);
  pdf.setLineWidth(1);
  pdf.line(mx, curY, mx + cw, curY);
  curY += 16;

  // 6. SYARAT & KETENTUAN ACARA CUSTOM (A4 multi-page support)
  let termsText = String(o.terms || '').trim();
  if (!termsText) {
    const ev = (S.aev && (S.aev.find(e => e.id === o.event_id) || S.aev.find(e => e.name === o.name || e.name === o.event_name))) ||
               (S.ev && (S.ev.find(e => e.id === o.event_id) || S.ev.find(e => e.name === o.name || e.name === o.event_name))) ||
               (S.pre && (S.pre.find(e => e.id === o.event_id) || S.pre.find(e => e.name === o.name || e.name === o.event_name)));
    if (ev && ev.terms) termsText = String(ev.terms).trim();
  }
  if (!termsText) {
    try {
      const allEvs = await (S.user ? api('events') : call('init', '')).catch(() => null);
      const evList = Array.isArray(allEvs) ? allEvs : (allEvs && allEvs.events) ? allEvs.events : [];
      if (evList.length) S.ev = evList;
      const matchedEv = evList.find(e => e.id === o.event_id || e.name === o.name || e.name === o.event_name);
      if (matchedEv && matchedEv.terms) termsText = String(matchedEv.terms).trim();
    } catch(errEv) {}
  }
  if (!termsText && o.ticket_code) {
    try {
      const pubInfo = await pub('ticketPublic', { code: o.ticket_code });
      if (pubInfo && pubInfo.terms) termsText = String(pubInfo.terms).trim();
    } catch(errPub) {}
  }
  if (!termsText && o.id) {
    try {
      const full = await api('orderDetail', { id: o.id });
      if (full && full.terms) termsText = String(full.terms).trim();
    } catch(x) {}
  }
  if (!termsText) termsText = defTerms();

  pdf.setFont('helvetica', 'bold');
  pdf.setFontSize(10);
  pdf.setTextColor(15, 18, 34);
  pdf.text('SYARAT & KETENTUAN ACARA', mx, curY);
  curY += 13;

  pdf.setFont('helvetica', 'normal');
  pdf.setFontSize(7.5);
  pdf.setTextColor(65, 70, 80);

  const paras = termsText.split(/\r?\n/).filter(p => p.trim().length > 0);
  for (const para of paras) {
    const lines = pdf.splitTextToSize(para.trim(), cw);
    if (curY + (lines.length * 9.5) > ph - 30) {
      pdf.addPage('a4', 'p');
      curY = 36;
      pdf.setFont('helvetica', 'bold');
      pdf.setFontSize(9);
      pdf.setTextColor(120, 128, 145);
      pdf.text('SYARAT & KETENTUAN ACARA (Lanjutan) — ' + (o.name || o.event_name || ''), mx, curY);
      curY += 14;
      pdf.setFont('helvetica', 'normal');
      pdf.setFontSize(7.5);
      pdf.setTextColor(65, 70, 80);
    }
    pdf.text(lines, mx, curY);
    curY += (lines.length * 9.5) + 3;
  }

  // 7. Footer on all pages
  const totalP = pdf.getNumberOfPages();
  for (let p = 1; p <= totalP; p++) {
    pdf.setPage(p);
    pdf.setFont('helvetica', 'normal');
    pdf.setFontSize(7.5);
    pdf.setTextColor(150, 155, 165);
    pdf.text('ambiltiketnya.online · Dokumen E-Tiket Resmi · Halaman ' + p + ' dari ' + totalP, mx, ph - 16);
  }

  pdf.save('E-Tiket-' + o.ticket_code + '.pdf');
}

function drawCertificateCanvas(cv, r){
 if(!cv)return;
 const ctx=cv.getContext('2d');
 const W=cv.width, H=cv.height;
 ctx.fillStyle='#fdfcf7';
 ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#f8f6ee';
 ctx.fillRect(40,40,W-80,H-80);

 ctx.strokeStyle='#0f172a';
 ctx.lineWidth=16;
 ctx.strokeRect(60,60,W-120,H-120);

 ctx.strokeStyle='#d97706';
 ctx.lineWidth=5;
 ctx.strokeRect(84,84,W-168,H-168);

 function corner(x, y, dx, dy){
   ctx.strokeStyle='#d97706';
   ctx.lineWidth=4;
   ctx.beginPath();
   ctx.moveTo(x, y + dy*40);
   ctx.lineTo(x, y);
   ctx.lineTo(x + dx*40, y);
   ctx.stroke();
   ctx.fillStyle='#0f172a';
   ctx.fillRect(x - 5, y - 5, 10, 10);
 }
 corner(96, 96, 1, 1);
 corner(W - 96, 96, -1, 1);
 corner(96, H - 96, 1, -1);
 corner(W - 96, H - 96, -1, -1);

 ctx.fillStyle='#0f172a';
 ctx.textAlign='center';
 ctx.font='700 24px "Segoe UI", Arial, sans-serif';
 ctx.fillText('AMBILTIKETNYA OFFICIAL VERIFICATION', W/2, 170);

 ctx.fillStyle='#d97706';
 ctx.font='900 68px "Georgia", serif';
 ctx.fillText(((r.config&&r.config.title)||'SERTIFIKAT PARTISIPASI').toUpperCase(), W/2, 275);

 ctx.fillStyle='#475569';
 ctx.font='italic 32px "Georgia", serif';
 ctx.fillText('Diberikan dengan penuh apresiasi kepada:', W/2, 360);

 ctx.fillStyle='#0f172a';
 ctx.font='900 78px "Georgia", serif';
 const pName=(r.name||'Nama Peserta').toUpperCase();
 ctx.fillText(pName, W/2, 470);

 ctx.strokeStyle='#d97706';
 ctx.lineWidth=3;
 ctx.beginPath();
 ctx.moveTo(W/2 - 280, 505);
 ctx.lineTo(W/2 + 280, 505);
 ctx.stroke();

 if(r.org){
   ctx.fillStyle='#64748b';
   ctx.font='700 32px "Segoe UI", Arial, sans-serif';
   ctx.fillText(r.org, W/2, 560);
 }

 ctx.fillStyle='#334155';
 ctx.font='400 32px "Georgia", serif';
 ctx.fillText('Atas partisipasi dan kehadirannya dalam kegiatan:', W/2, 650);

 ctx.fillStyle='#0f172a';
 ctx.font='800 48px "Segoe UI", Arial, sans-serif';
 ctx.fillText(r.eventName||'Nama Acara', W/2, 730);

 ctx.fillStyle='#64748b';
 ctx.font='400 28px "Segoe UI", Arial, sans-serif';
 const dateStr=r.eventDate?fd(r.eventDate,{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'';
 ctx.fillText((dateStr?'Diselenggarakan pada '+dateStr:'')+(r.location?' bertempat di '+r.location:''), W/2, 800);

 const qrUrl=location.origin+location.pathname+'?verify_cert='+encodeURIComponent(r.code);
 
 ctx.textAlign='left';
 ctx.fillStyle='#0f172a';
 ctx.font='700 22px monospace';
 ctx.fillText('NO: CERT-'+r.code, 150, 1140);
 ctx.fillStyle='#64748b';
 ctx.font='400 20px sans-serif';
 ctx.fillText('Keaslian sertifikat terdaftar resmi di sistem.', 150, 1175);
 ctx.fillText('Pindai QR untuk verifikasi keaslian daring.', 150, 1205);

 ctx.textAlign='center';
 const sigX=W - 350;
 ctx.strokeStyle='#0f172a';
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.moveTo(sigX - 180, 1180);
 ctx.lineTo(sigX + 180, 1180);
 ctx.stroke();

 ctx.fillStyle='#0f172a';
 ctx.font='800 30px "Segoe UI", Arial, sans-serif';
 ctx.fillText((r.config&&r.config.signatory)||'Penyelenggara Acara', sigX, 1220);

 ctx.fillStyle='#64748b';
 ctx.font='600 24px "Segoe UI", Arial, sans-serif';
 ctx.fillText((r.config&&r.config.signatory_title)||'Ketua Panitia', sigX, 1260);

 if(typeof QRCode!=='undefined'||typeof qrcode!=='undefined'){
   const tempDiv=document.createElement('div');
   tempDiv.innerHTML=qr(qrUrl);
   const img=tempDiv.querySelector('img');
   if(img){
     img.onload=function(){ ctx.drawImage(img, 150, 930, 160, 160); };
     if(img.complete) ctx.drawImage(img, 150, 930, 160, 160);
   }
 }
}

 c.innerHTML = `<div class="gate" style="padding:40px 16px"><div class="card tkc" style="max-width:560px"><div class="tkq" style="padding:32px"><p class="muted">Memuat portal penyelenggara...</p></div></div></div>`;
 let res = null;
 try {
   res = await pub('organizerPublic', { slug: slug });
 } catch(e) {
   res = null;
 }
 if(!res || !res.found || !res.organizer){
   c.innerHTML = `<div class="gate" style="padding:40px 16px">
     <div class="card tkc" style="max-width:480px;text-align:center;padding:32px 24px">
       <div style="font-size:48px;margin-bottom:12px">🏢</div>
       <h2 style="margin:0 0 8px">Penyelenggara Tidak Ditemukan</h2>
       <p class="muted" style="margin:0 0 20px">Portal EO dengan tautan <code>@${esc(slug)}</code> tidak terdaftar atau belum aktif.</p>
       <a class="btn pri" style="text-decoration:none;display:inline-block;padding:10px 20px" href="${esc(location.pathname)}">← Jelajahi Semua Acara</a>
     </div>
   </div>`;
   return;
 }
 const org = res.organizer;
 const evs = res.events || [];
 const bannerStyle = org.banner_url ? `background-image:url('${esc(org.banner_url)}');background-size:cover;background-position:center;` : `background:linear-gradient(135deg,var(--ac,#2563eb),#4f46e5);`;
 const avatarHtml = org.logo_url ? `<img src="${esc(org.logo_url)}" style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid var(--card,#fff);box-shadow:0 4px 12px rgba(0,0,0,.15);background:var(--card,#fff)">` : `<div style="width:80px;height:80px;border-radius:50%;background:var(--card,#fff);color:var(--ac,#2563eb);font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center;border:3px solid var(--card,#fff);box-shadow:0 4px 12px rgba(0,0,0,.15)">${esc(org.name.slice(0,2).toUpperCase())}</div>`;
 
 const waClean = (org.contact_phone || '').replace(/[^0-9]/g,'');
 const waHref = waClean ? `https://wa.me/${waClean}?text=${encodeURIComponent('Halo ' + org.name + ', saya ingin bertanya mengenai acara Anda di ambiltiketnya.online')}` : null;
 const mailHref = org.contact_email ? `mailto:${esc(org.contact_email)}` : null;

 c.innerHTML = `
 <div style="min-height:100vh;background:var(--bg,#f8fafc);color:var(--tx,#0f172a);padding-bottom:60px">
   <!-- Navbar -->
   <header style="background:var(--card,#fff);border-bottom:1px solid var(--bd,rgba(0,0,0,.08));padding:12px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10">
     <div style="display:flex;align-items:center;gap:10px">
       <a href="${esc(location.pathname)}" style="text-decoration:none;display:flex;align-items:center;gap:8px;color:var(--tx);font-weight:700">
         <i>${ico(ICN.ticket)}</i>
         <span>ambiltiketnya<b>.online</b></span>
       </a>
     </div>
     <div style="display:flex;align-items:center;gap:8px">
       <button class="ib" data-act="themecycle" title="${t('theme')}">${IC[TH]}</button>
       <a href="${esc(location.pathname)}" class="btn sm" style="text-decoration:none">Semua Acara</a>
     </div>
   </header>

   <!-- Cover Banner -->
   <div style="height:180px;width:100%;${bannerStyle};position:relative"></div>

   <!-- EO Profile Header -->
   <div style="max-width:860px;margin:-48px auto 24px;padding:0 20px;position:relative">
     <div class="card" style="padding:24px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.06)">
       <div style="display:flex;flex-wrap:wrap;gap:20px;align-items:center">
         ${avatarHtml}
         <div style="flex:1;min-width:240px">
           <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
             <h1 style="font-size:22px;margin:0;font-weight:800">${esc(org.name)}</h1>
             ${org.is_verified ? `<span class="badge" style="background:#059669;color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:12px">✓ Terverifikasi</span>` : ''}
           </div>
           <small class="muted mono" style="display:block;margin:2px 0 8px">@${esc(org.slug)}</small>
           ${org.description ? `<p style="margin:0 0 12px;font-size:14px;color:var(--mu,#64748b);line-height:1.5">${esc(org.description)}</p>` : ''}
           <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
             ${waHref ? `<a class="btn sm" style="text-decoration:none;background:#25d366;color:#fff;border:none;display:inline-flex;align-items:center;gap:6px" href="${waHref}" target="_blank"><i>${ico(ICN.wa)}</i> WhatsApp</a>` : ''}
             ${mailHref ? `<a class="btn sm" style="text-decoration:none;display:inline-flex;align-items:center;gap:6px" href="${mailHref}">✉️ Hubungi EO</a>` : ''}
             <button class="btn sm" data-act="copyOrgLink" data-url="${location.href}">🔗 Bagikan Portal</button>
           </div>
         </div>
       </div>
     </div>
   </div>

   <!-- Event Catalog of EO -->
   <div style="max-width:860px;margin:0 auto;padding:0 20px">
     <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
       <h2 style="font-size:18px;margin:0;font-weight:800">Acara Resmi Penyelenggara</h2>
       <span class="badge" style="background:var(--card-sub,rgba(0,0,0,.05));font-size:12px;padding:4px 10px;border-radius:20px;font-weight:600">${evs.length} Acara Aktif</span>
     </div>

     ${evs.length === 0 ? `
       <div class="card" style="padding:40px 20px;text-align:center">
         <div style="font-size:40px;margin-bottom:8px">🎟️</div>
         <h3 style="margin:0 0 6px">Belum Ada Acara Aktif</h3>
         <p class="muted" style="margin:0">Penyelenggara ini belum mempublikasikan tiket acara saat ini. Silakan cek kembali nanti.</p>
       </div>
     ` : `
       <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px">
         ${evs.map(ev => {
           const remain = ev.quota - (ev.booked || 0);
           const isSoldOut = remain <= 0;
           const priceText = ev.is_paid && ev.price > 0 ? rp(ev.price) : 'Gratis';
           return `
           <div class="card" style="overflow:hidden;display:flex;flex-direction:column;border-radius:14px;border:1px solid var(--bd,rgba(0,0,0,.08))">
             ${ev.banner_url ? `<img src="${esc(ev.banner_url)}" style="width:100%;height:140px;object-fit:cover" onerror="this.style.display='none'">` : ''}
             <div style="padding:16px;flex:1;display:flex;flex-direction:column">
               <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
                 <span class="badge" style="background:var(--card-sub);font-size:11px">${esc(ev.category||'Umum')}</span>
                 <b style="color:var(--ac);font-size:13px">${priceText}</b>
               </div>
               <h3 style="font-size:16px;margin:0 0 8px;font-weight:700;line-height:1.3">${esc(ev.name)}</h3>
               <div class="muted" style="font-size:12px;line-height:1.6;margin-bottom:14px">
                 <div>📅 ${fd(ev.edate||ev.event_date)} &#183; ${ev.stime||ev.start_time}${ev.etime?(' - '+ev.etime):''}</div>
                 <div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">📍 ${esc(ev.location)}</div>
               </div>
               <div style="margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid var(--bd,rgba(0,0,0,.05))">
                 <small class="muted" style="font-size:11px">Sisa: <b>${Math.max(0, remain)}</b> / ${ev.quota}</small>
                 <a class="btn sm pri" style="text-decoration:none" href="${location.pathname}?ev=${ev.id}">${isSoldOut ? 'Tiket Habis' : 'Pesan Tiket →'}</a>
               </div>
             </div>
           </div>`;
         }).join('')}
       </div>
     `}
   </div>
 </div>
 `;
}


function showRsvpModal(ev){
 if(!S.user)return gateModal();
 const fields=(ev&&Array.isArray(ev.custom_fields))?ev.custom_fields:[];
 const cfg=ev.module_config||{};
 const maxPlus=cfg.max_plus_one||2;
 modal(`
 <button class="btn sm x" data-act="cm">&#10005;</button>
 <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
   <div style="font-size:28px">✉️</div>
   <div>
     <h2 style="margin:0;font-size:18px">Konfirmasi Kehadiran (RSVP)</h2>
     <b style="font-size:14px;color:var(--ac,#5b4ef0)">${esc(ev.name)}</b>
   </div>
 </div>
 <p class="muted" style="margin:0 0 14px;font-size:12px">📅 ${fd(ev.event_date)} &#183; 📍 ${esc(ev.location)}</p>

 <form id="rsvp_form" onsubmit="return false">
   <label style="font-size:12px;font-weight:700;display:block;margin-bottom:6px">Apakah Anda dapat menghadiri acara ini?</label>
   
   <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:14px">
     <label style="display:flex;flex-direction:column;align-items:center;padding:10px;border-radius:10px;border:2px solid var(--ok,#10b981);background:var(--card,#fff);cursor:pointer;text-align:center">
       <input type="radio" name="rsvp_status" value="attending" checked style="margin-bottom:6px" onchange="var b=document.getElementById('rsvp_attending_box');if(b)b.style.display='block'">
       <b style="color:var(--ok,#10b981);font-size:13px">🟢 Pasti Hadir</b>
       <small class="muted" style="font-size:10px">Saya akan datang</small>
     </label>
     
     <label style="display:flex;flex-direction:column;align-items:center;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card,#fff);cursor:pointer;text-align:center">
       <input type="radio" name="rsvp_status" value="declined" style="margin-bottom:6px" onchange="var b=document.getElementById('rsvp_attending_box');if(b)b.style.display='none'">
       <b style="color:var(--er,#ef4444);font-size:13px">🔴 Berhalangan</b>
       <small class="muted" style="font-size:10px">Tidak dapat hadir</small>
     </label>

     <label style="display:flex;flex-direction:column;align-items:center;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card,#fff);cursor:pointer;text-align:center">
       <input type="radio" name="rsvp_status" value="tentative" style="margin-bottom:6px" onchange="var b=document.getElementById('rsvp_attending_box');if(b)b.style.display='block'">
       <b style="color:var(--wn,#f59e0b);font-size:13px">🟡 Ragu-ragu</b>
       <small class="muted" style="font-size:10px">Belum pasti</small>
     </label>
   </div>

   <div id="rsvp_attending_box">
     ${cfg.allow_plus_one ? `
       <div style="margin-bottom:12px">
         <label style="font-size:12px;font-weight:700">Bersama Pendamping / Rekan?</label>
         <select name="plus_one_count" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--bd);font-size:13px">
           <option value="0">Hadir Sendiri (Tanpa Pendamping/Rekan)</option>
           ${Array.from({length: maxPlus}, (_, i) => `<option value="${i+1}">Hadir Bersama +${i+1} Orang (Total ${i+2} Orang)</option>`).join('')}
         </select>
       </div>
     ` : ''}

     ${fields.length > 0 ? `
       <div style="background:var(--in,rgba(0,0,0,.03));border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px">
         <b style="font-size:12px;display:block;margin-bottom:8px">Informasi Tambahan:</b>
         ${fields.map(f=>{
           let inp='';
           if(f.type==='select'){
             const opts=(Array.isArray(f.options)?f.options:(f.options||'').split(',')).map(s=>s.trim()).filter(Boolean);
             inp=`<select class="cq-val" data-id="${esc(f.id)}" data-lbl="${esc(f.label)}" data-req="${f.required?'1':'0'}" style="width:100%;padding:8px;border-radius:6px;border:1px solid var(--bd);font-size:13px">
               <option value="">-- Pilih ${esc(f.label)} --</option>
               ${opts.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}
             </select>`;
           } else {
             inp=`<input class="cq-val" data-id="${esc(f.id)}" data-lbl="${esc(f.label)}" data-req="${f.required?'1':'0'}" type="${f.type||'text'}" placeholder="Jawaban Anda..." style="width:100%;padding:8px;border-radius:6px;border:1px solid var(--bd);font-size:13px">`;
           }
           return `<div style="margin-bottom:8px"><label style="font-size:11px">${esc(f.label)} ${f.required?'<span style="color:var(--er)">*</span>':''}</label>${inp}</div>`;
         }).join('')}
       </div>
     ` : ''}
   </div>

   <div style="margin-bottom:14px">
     <label style="font-size:12px;font-weight:700">✉️ Buku Tamu &amp; Ucapan / Pesan (Opsional)</label>
     <textarea name="guestbook_message" rows="3" placeholder="Tuliskan ucapan selamat, doa, atau pesan untuk penyelenggara..." style="width:100%;border-radius:8px;border:1px solid var(--bd);padding:10px;font-size:13px;box-sizing:border-box"></textarea>
     <small class="muted" style="font-size:10px">Pesan Anda akan tampil di buku tamu digital &amp; layar acara.</small>
   </div>

   <div class="acts" style="display:flex;gap:8px;justify-content:flex-end">
     <button class="btn" data-act="cm">Batal</button>
     <button class="btn pri" data-act="submitRsvp" data-id="${ev.id}">Kirim Konfirmasi Kehadiran</button>
   </div>
 </form>
 `);
}

let S_invCountdownTimer = null;
async function digitalInvitationView(code, toParam) {
  applyTheme();
  const c = $('#app');
  if (S_invCountdownTimer) clearInterval(S_invCountdownTimer);

  c.innerHTML = `
  <div style="min-height:100vh;background:#090d16;display:flex;align-items:center;justify-content:center;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif">
    <div style="text-align:center;padding:24px">
      <div style="font-size:48px;animation:pulse 1.5s infinite">✉️</div>
      <div style="margin-top:16px;font-size:15px;letter-spacing:3px;text-transform:uppercase;color:#d4af37;font-weight:700">Mempersiapkan Undangan...</div>
    </div>
  </div>`;

  let res = null;
  try {
    res = await pub('digitalInvitationInfo', { code: code });
  } catch(e) {
    res = null;
  }

  if (!res || !res.found) {
    c.innerHTML = `
    <div style="min-height:100vh;background:#090d16;display:flex;align-items:center;justify-content:center;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;padding:20px">
      <div style="max-width:440px;width:100%;background:#111827;border:1px solid rgba(212,175,55,.3);border-radius:20px;padding:32px 24px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.6)">
        <div style="font-size:48px;margin-bottom:12px">⚠️</div>
        <h2 style="margin:0 0 8px;font-size:20px;color:#f1f5f9">Undangan / Tiket Tidak Ditemukan</h2>
        <p style="color:#94a3b8;font-size:14px;line-height:1.6;margin:0 0 20px">Link atau kode tiket undangan yang Anda tuju tidak terdaftar atau sudah kadaluarsa.</p>
        <a class="btn pri" href="${location.pathname}" style="text-decoration:none;display:inline-block;padding:10px 24px">Menuju Beranda</a>
      </div>
    </div>`;
    return;
  }

  await waitQr(30);

  const isOrder = res.type === 'order';
  const ord = isOrder ? res.order : null;
  const ev = isOrder ? ord : res.event;

  const isRsvpEvent = hasMod(ev, 'rsvp');
  const modConfig = getModConfig(ev);
  const allowPlusOne = modConfig.allow_plus_one !== false;
  const maxPlusOne = allowPlusOne ? (modConfig.max_plus_one != null ? Math.max(0, parseInt(modConfig.max_plus_one, 10) || 0) : 2) : 0;

  let guestName = (ord && ord.guest_name) || toParam || 'Tamu Terhormat';
  let guestOrg = (ord && ord.guest_org) || '';
  let guestPhone = (ord && ord.guest_phone) || '';
  let rsvpStatus = (ord && ord.rsvp_status) || (isRsvpEvent ? 'pending' : 'attending');
  let plusOne = (ord && ord.plus_one_count) || 0;
  let guestbookMsg = (ord && ord.guestbook_message) || '';
  let tableAssignment = (ord && ord.table_assignment) || '';
  let ticketCode = (ord && ord.ticket_code) || '';
  let wishes = res.wishes || [];

  const musicUrl = modConfig.music_url || 'https://assets.mixkit.co/music/preview/mixkit-wedding-dreams-565.mp3';

  // Format date and time
  const evDateStr = ev.event_date ? fd(ev.event_date, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) : '-';
  const evTimeStr = (ev.start_time ? ev.start_time : '') + (ev.end_time ? ' - ' + ev.end_time : '') + ' WIB';

  // Google Calendar URL
  const gCalTitle = encodeURIComponent(ev.event_name);
  const gCalDesc = encodeURIComponent((ev.description || ev.event_name) + '\n\nUndangan resmi via Ambiltiketnya: ' + location.href);
  const gCalLoc = encodeURIComponent(ev.location || '');
  const dClean = ev.event_date ? ev.event_date.replace(/-/g, '') : '';
  const stClean = ev.start_time ? ev.start_time.replace(/:/g, '') + '00' : '090000';
  const etClean = ev.end_time ? ev.end_time.replace(/:/g, '') + '00' : '120000';
  const gCalDates = dClean ? `${dClean}T${stClean}/${dClean}T${etClean}` : '';
  const gCalUrl = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${gCalTitle}&dates=${gCalDates}&details=${gCalDesc}&location=${gCalLoc}`;

  // Google Maps URL
  const gMapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(ev.location || ev.event_name);

  function renderWishesFeed() {
    if (!wishes.length) {
      return `<p style="color:#94a3b8;font-size:13px;text-align:center;padding:20px 0;margin:0">Belum ada ucapan. Jadilah yang pertama memberikan ucapan dan pesan!</p>`;
    }
    return wishes.map(w => `
      <div style="background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:14px 16px;margin-bottom:10px;text-align:left">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <div style="display:flex;align-items:center;gap:8px">
            <div style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#d4af37,#92400e);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700">${esc((w.name||'T').slice(0,1).toUpperCase())}</div>
            <div>
              <b style="font-size:13px;color:#f8fafc">${esc(w.name || 'Tamu')}</b>
              ${w.org ? `<span style="font-size:11px;color:#94a3b8;margin-left:6px">&#183; ${esc(w.org)}</span>` : ''}
            </div>
          </div>
          <small style="font-size:10px;color:#64748b">${esc(w.time_str || '')}</small>
        </div>
        <p style="margin:0;font-size:13px;color:#cbd5e1;line-height:1.5;white-space:pre-wrap;font-style:italic">"${esc(w.message)}"</p>
      </div>
    `).join('');
  }

  function renderVipPass() {
    if (isRsvpEvent && rsvpStatus !== 'attending') return '';
    if (!ticketCode && !ord) return '';

    const passHeader = isRsvpEvent ? 'PAS KEDATANGAN RESMI' : 'PAS MASUK ACARA (E-TIKET)';
    const passBadge = isRsvpEvent ? 'VIP E-PASS' : 'E-TIKET RESMI';
    const paxStr = isRsvpEvent ? `Jumlah Tamu: <b style="color:#fef08a">${1 + plusOne} Orang</b>` : `Jumlah Tiket: <b style="color:#818cf8">${(ord && ord.qty) || 1} Tiket</b>`;
    const hintStr = isRsvpEvent ? 'Tunjukkan kode QR ini kepada penerima tamu di gerbang registrasi untuk check-in instan.' : 'Tunjukkan kode QR ini kepada petugas di pintu masuk (gate) saat tiba di lokasi acara.';

    return `
    <div style="background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);border:2px solid ${isRsvpEvent?'#d4af37':'#6366f1'};border-radius:20px;padding:24px 20px;margin-top:24px;text-align:center;position:relative;overflow:hidden;box-shadow:0 12px 30px ${isRsvpEvent?'rgba(212,175,55,.2)':'rgba(99,102,241,.2)'}">
      <div style="position:absolute;top:0;right:0;background:linear-gradient(135deg,${isRsvpEvent?'#d4af37,#92400e':'#6366f1,#4f46e5'});color:#fff;font-size:10px;letter-spacing:2px;font-weight:900;padding:4px 20px;border-bottom-left-radius:12px;text-transform:uppercase">${passBadge}</div>
      <div style="color:${isRsvpEvent?'#d4af37':'#818cf8'};letter-spacing:4px;font-size:11px;font-weight:800;text-transform:uppercase;margin-bottom:6px">${passHeader}</div>
      <h3 style="margin:0 0 4px;font-size:18px;color:#fff">${esc(guestName)}</h3>
      <div style="font-size:12px;color:#94a3b8;margin-bottom:16px">${paxStr}</div>

      ${(isRsvpEvent && tableAssignment) ? `
      <div style="background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.4);border-radius:12px;padding:10px;margin-bottom:16px">
        <div style="font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#d4af37;font-weight:700">NOMOR / POSISI MEJA</div>
        <div style="font-size:20px;font-weight:900;color:#fff;letter-spacing:1px">${esc(tableAssignment)}</div>
      </div>` : ''}

      <div style="background:#fff;padding:14px;border-radius:14px;display:inline-block;box-shadow:0 8px 20px rgba(0,0,0,.4)">
        <div style="width:180px;height:180px;display:grid;place-items:center">
          ${typeof qrcode !== 'undefined' ? qr(ticketCode) : '<p style="color:#000">Memuat QR...</p>'}
        </div>
      </div>

    let curChoice = (rsvpStatus === 'declined') ? 'declined' : 'attending';
    const btnAttending = document.getElementById('btn_choice_attending');
    const btnDeclined = document.getElementById('btn_choice_declined');
    const plusOneBox = document.getElementById('inv_plus_one_box');

    function updateChoiceUI(choice) {
      curChoice = choice;
      if (choice === 'attending') {
        btnAttending.style.borderColor = '#10b981';
        btnAttending.style.background = 'rgba(16,185,129,.15)';
        btnAttending.style.color = '#6ee7b7';
        btnDeclined.style.borderColor = 'rgba(255,255,255,.1)';
        btnDeclined.style.background = 'transparent';
        btnDeclined.style.color = '#94a3b8';
        if (plusOneBox) plusOneBox.style.display = 'block';
      } else {
        btnDeclined.style.borderColor = '#ef4444';
        btnDeclined.style.background = 'rgba(239,68,68,.15)';
        btnDeclined.style.color = '#fca5a5';
        btnAttending.style.borderColor = 'rgba(255,255,255,.1)';
        btnAttending.style.background = 'transparent';
        btnAttending.style.color = '#94a3b8';
        if (plusOneBox) plusOneBox.style.display = 'none';
      }
    }

    if (btnAttending) btnAttending.onclick = () => updateChoiceUI('attending');
    if (btnDeclined) btnDeclined.onclick = () => updateChoiceUI('declined');

    const rsvpForm = document.getElementById('inv_rsvp_form');
    const btnSubmit = document.getElementById('btn_submit_rsvp');

    if (rsvpForm) {
      rsvpForm.onsubmit = async (e) => {
        e.preventDefault();
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = 'Menyimpan...';

        const sendName = document.getElementById('inv_inp_name') ? document.getElementById('inv_inp_name').value.trim() : guestName;
        const sendPhone = document.getElementById('inv_inp_phone') ? document.getElementById('inv_inp_phone').value.trim() : guestPhone;
        const sendOrg = document.getElementById('inv_inp_org') ? document.getElementById('inv_inp_org').value.trim() : guestOrg;
        const sendPlusOne = (curChoice === 'declined') ? 0 : (parseInt((document.getElementById('inv_plus_one')||{}).value, 10) || 0);
        const sendMsg = (document.getElementById('inv_inp_msg') ? document.getElementById('inv_inp_msg').value.trim() : '');

        try {
          const resp = await pub('digitalInvitationRsvp', {
            code: code,
            rsvp_status: curChoice,
            plus_one_count: sendPlusOne,
            guestbook_message: sendMsg,
            guest_name: sendName,
            guest_phone: sendPhone,
            guest_org: sendOrg
          });

          rsvpStatus = curChoice;
          plusOne = (resp && resp.plus_one_count != null) ? resp.plus_one_count : sendPlusOne;
          guestbookMsg = sendMsg;
          guestName = sendName || guestName;
          guestOrg = sendOrg || guestOrg;
          if (resp && resp.ticket_code) ticketCode = resp.ticket_code;

          // Update status badge & VIP pass
          const badgeEl = document.getElementById('inv_status_badge');
          if (badgeEl) badgeEl.innerHTML = renderRsvpStatusBadge();

          const vipEl = document.getElementById('inv_vip_box');
          if (vipEl) vipEl.innerHTML = renderVipPass();

          // If message was written, add to wishes
          if (sendMsg) {
            wishes.unshift({
              name: guestName,
              org: guestOrg,
              message: sendMsg,
              time_str: 'Baru saja'
            });
            const wishesListEl = document.getElementById('inv_wishes_list');
            if (wishesListEl) wishesListEl.innerHTML = renderWishesFeed();
            const wishesCntEl = document.getElementById('inv_wishes_cnt');
            if (wishesCntEl) wishesCntEl.innerText = wishes.length + ' Pesan';
          }

          toast(curChoice === 'attending' ? 'Terima kasih! Konfirmasi kehadiran Anda telah tersimpan.' : 'Terima kasih telah mengonfirmasi bahwa Anda berhalangan hadir.', 0);
        } catch(err) {
          toast('Gagal menyimpan konfirmasi: ' + (err.message || 'Terjadi kesalahan'), 1);
        } finally {
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = '💾 Kirim Konfirmasi &amp; Ucapan';
        }
      };
    }
  }
}

async function getGeminiCandidateModels(apiKey) {
  const preferred = ['gemini-3.8-flash', 'gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-2.5-flash-lite', 'gemini-2.0-flash-lite'];
  try {
    const listRes = await fetch('https://generativelanguage.googleapis.com/v1beta/models?key=' + encodeURIComponent(apiKey));
    if (listRes.ok) {
      const data = await listRes.json();
      if (Array.isArray(data.models)) {
        const available = data.models
          .filter(m => Array.isArray(m.supportedGenerationMethods) && m.supportedGenerationMethods.includes('generateContent'))
          .map(m => m.name.replace(/^models\//, ''));
        const matched = preferred.filter(p => available.includes(p));
        const others = available.filter(a => !matched.includes(a) && a.startsWith('gemini') && !a.includes('embedding') && !a.includes('image'));
        const result = [...matched, ...others];
        if (result.length > 0) return result;
      }
    }
  } catch (e) {}
  return preferred;
}

  dlGateManifestJson() {
    const data = window._lastGateManifest;
    if (!data) return toast('Data tiket belum tersedia.', 1);
    const str = JSON.stringify(data, null, 2);
    const blob = new Blob([str], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const evName = (data.eventName || 'Acara').replace(/[^a-zA-Z0-9]/g, '_');
    a.download = `tiket_gatehub_${evName}.json`;
    document.body.appendChild(a);

  async sendToGateHub(el) {
    const sel = $('#off_ev_sel');
    const evId = (el && el.dataset && el.dataset.id) || (sel && sel.value) || getCurEvId();
    if (!evId) return toast('Pilih acara terlebih dahulu.', 1);

    const curEv = (S.aev && S.aev.find(x => x.id === evId));
    const evName = curEv ? curEv.name : 'Acara Terpilih';

    toast('Mengambil tiket dari cloud...', 0);
    try {
      const res = await api('offlineManifest', { eventId: evId }, t('loading'));
      if (!res || !res.tickets) throw new Error('Data tiket kosong');

      try {
        const hubRes = await fetch('http://localhost:8080/api/save-manifest', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(res)
        });
        const hubData = await hubRes.json();
        if (hubData.ok) {
          toast(`✅ Sukses mengirim ${hubData.count} tiket acara "${esc(hubData.eventName)}" ke Gate Hub Laptop! 🚀`, 0);
        } else {
          toast('Gate Hub merespons: ' + (hubData.error || 'Gagal menyimpan'), 1);
        }
      } catch(errHub) {
        window._lastGateManifest = res;
        modal(`
          <button class="btn sm x" data-act="cm">&#10005;</button>
          <div style="text-align:center;padding:22px 16px">
            <div style="font-size:36px;margin-bottom:8px">💻</div>
            <h3 style="margin:0 0 6px">Koneksi Browser ke Gate Hub Dibatasi</h3>
            <p class="muted" style="margin:0 auto 14px;max-width:390px;font-size:13px;line-height:1.5">
              Data tiket acara <b>"${esc(evName)}"</b> (${res.count} tiket) sudah siap! Namun browser membatasi koneksi langsung dari website HTTPS ke HTTP lokal.

  fbExportCsv(){
  const rows = (S_fb.data && S_fb.data.rows) || [];
  if (!rows.length) return toast(t('none'), 1);
  const headers = ['Waktu', 'Acara', 'Skor Keseluruhan', 'Konten & Pengisi Acara', 'Pelayanan Panitia', 'Fasilitas Venue', 'Sound & Multimedia', 'Anonim', 'Nama Peserta', 'Asal Gereja / Instansi', 'Komentar / Masukan'];
  const data = rows.map(r => [
   r.created_at_fmt || '',
   r.event_name || '',
   (r.rating_overall || r.rating) + '★',
   (r.rating_content || 5) + '★',
   (r.rating_service || 5) + '★',
   (r.rating_venue || 5) + '★',
   (r.rating_sound || 5) + '★',
   r.is_anonymous ? 'Ya (Anonim)' : 'Tidak',
   r.is_anonymous ? 'Anonim' : (r.author_name || ''),
   r.is_anonymous ? '-' : (r.author_org || ''),
   (r.comment || '').replace(/"/g, '""')
  ]);
  const csv = '\uFEFF' + [headers].concat(data).map(arr => arr.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Survey_MultiAspek_' + (S_fb.evId || 'Semua') + '_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
 },

  async testAiKey() {
    const inp = $('#gemini_key_inp');
    const key = (inp ? inp.value : (ls.g('atk_gemini_key') || '')).trim();
    const st = $('#ai_test_status');
    if (!key) {
      if (st) st.innerHTML = '<span style="color:var(--er);font-weight:700">⚠️ Masukkan API Key terlebih dahulu.</span>';
      return;
    }
    if (st) st.innerHTML = '<span style="color:var(--wn);font-weight:600">⏳ Menguji koneksi ke Google Gemini AI...</span>';

    // 1. Uji via Cloudflare Worker dahulu (koneksi server ke Google super cepat & bebas blokir ISP/adblocker)
    try {
      const res = await api('testAiKey', { geminiApiKey: key });
      if (st) st.innerHTML = `<span style="color:var(--ok);font-weight:700">✓ Terhubung Berhasil! (Model: ${esc(res.model)})</span><br><small class="muted">Balasan AI: "${esc(res.reply)}"</small>`;
      toast('Uji koneksi AI sukses! 🚀', 0);
      ls.s('atk_gemini_key', key);
      return;
    } catch(errServer) {
      const serverMsg = String(errServer ? errServer.message : '');

        if (nw) {
          nw.addEventListener('statechange', () => {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
              nw.postMessage({ type: 'SKIP_WAITING' });
            }
          });
        }
      });
    }).catch(e => console.log('[SW] error:', e));
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!reloading) { reloading = true; window.location.reload(); }
    });
  });
}
// Baca ?tab= dari URL untuk PWA shortcut (mis. /?tab=tickets dari manifest shortcut)
(function(){
  try {
    var tab = new URLSearchParams(location.search).get('tab');
    if(tab) {
      // simpan ke session agar boot() bisa pakai
      var orig = window.__initTabOverride;
      window.__initTabOverride = tab;
    }
  } catch(e) {}
})();
