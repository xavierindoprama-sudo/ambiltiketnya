<script>(function(){var el=document.getElementById('src'),src=el.textContent;
function show(m){var d=document.createElement('pre');d.style.cssText='position:fixed;left:0;right:0;bottom:0;margin:0;background:#400;color:#fff;padding:10px;z-index:99;white-space:pre-wrap;font:12px monospace';d.textContent='DEBUG2: '+m;document.body.appendChild(d)}
function need(m){var a=document.getElementById('app');if(a)a.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Arial,sans-serif;text-align:center"><div><h2>Konfigurasi belum lengkap</h2><p>'+m+'</p></div></div>'}
function go(){try{new Function(src)()}catch(e){var bad=[],k;for(k=0;k<src.length&&bad.length<8;k++){var c=src.charCodeAt(k);if(c>126||(c<32&&c!==10&&c!==9))bad.push(k+':'+c)}
show(e.name+': '+e.message+' | len='+src.length+' | backslashes='+(src.split(String.fromCharCode(92)).length-1)+' | oddchars='+bad.join(','))}}
var h=location.hostname||'',inGas=(typeof google!=='undefined'&&google&&google.script)||h.indexOf('googleusercontent.com')>=0||h.indexOf('script.google.com')>=0;
if(inGas||window.APP_API_URL)go();
else{var sc=document.createElement('script');sc.src='config.js';
 sc.onload=function(){window.APP_API_URL?go():need('APP_API_URL belum diisi di config.js.')};
 sc.onerror=function(){need('File config.js tidak ditemukan. Unggah config.js ke folder yang sama dengan index.html.')};
 document.head.appendChild(sc)}})();
</script>
<script>
// Daftarkan Service Worker (hanya di GitHub Pages, bukan di GAS iframe)
if('serviceWorker' in navigator && !window.google?.script) {

    navigator.serviceWorker.register('/sw.js').then(reg => {
      console.log('[SW] registered:', reg.scope);
    }).catch(e => console.log('[SW] error:', e));
  });
}
// Baca ?tab= dari URL untuk PWA shortcut (mis. /?tab=tickets dari manifest shortcut)
(function(){
  try {
    var tab = new URLSearchParams(location.search).get('tab');
    if(tab) {
      // simpan ke session agar boot() bisa pakai
      var orig = window.__initTabOverride;
      window.__initTabOverride = tab;
    }
  } catch(e) {}
})();
